    <main class="talks-container">

        <!-- Temporary: remove the look switcher once a favorite look is chosen -->

            <span>Look:</span>
            <button type="button" data-look="timeline"><i class="bi bi-list-ul"></i> Timeline</button>
            <button type="button" data-look="cards"><i class="bi bi-grid"></i> Cards</button>
        </div>

        <div class="talks-filters">
            <input type="search" id="talks-search" placeholder="Search by title or event" aria-label="Search talks by title or event">
            <select id="talks-year" aria-label="Filter talks by year">
                <option value="">All years</option>
            </select>
        </div>

        <p id="talks-status" class="talks-status" role="status">Loading...</p>
        <noscript><p class="talks-status">Please enable JavaScript to see the list of talks.</p></noscript>

        <section id="upcoming-section" hidden>
            <h2>Upcoming Talks</h2>
            <div id="upcoming-talks"></div>
        </section>

        <section id="past-section" hidden>
            <h2>Past Talks</h2>
            <div id="past-talks"></div>
        </section>

        <div class="nav-links">
